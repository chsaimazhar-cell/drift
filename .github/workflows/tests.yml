name: Drift tests

on:
  push:
    branches: [public-deployment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Vercel frontend
        env:
          DRIFT_API_BASE_URL: https://backend.example.invalid
        run: npm run build
      - name: Check frontend JavaScript syntax
        run: node --check public/js/app.js && node --check public/runtime-config.js
      - name: Validate deployment Compose configuration
        env:
          DRIFT_ALLOWED_ORIGIN: https://drift.example.invalid
        run: docker compose config --quiet
      - name: Build backend container
        run: docker build --tag drift-backend:ci .
