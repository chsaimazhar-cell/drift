name: Drift tests

on:
  push:
    branches: [public-deployment]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: drift
          POSTGRES_PASSWORD: drift-test-password
          POSTGRES_DB: drift_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U drift -d drift_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DRIFT_TEST_DATABASE_URL: postgresql://drift:drift-test-password@localhost:5432/drift_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-test-postgres.txt
      - name: Run unit and PostgreSQL integration tests
        run: python -m unittest discover -s tests -v
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build Vercel frontend
        env:
          DRIFT_API_BASE_URL: https://backend.example.invalid
        run: npm run build
      - name: Check frontend JavaScript syntax
        run: node --check public/js/app.js && node --check public/runtime-config.js
      - name: Validate deployment Compose configuration
        env:
          DRIFT_ALLOWED_ORIGIN: https://drift.example.invalid
        run: docker compose config --quiet
      - name: Build backend container
        run: docker build --tag drift-backend:ci .
